<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de teclado · aprova+</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #050b16; color: #f3f3f3; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: #b8c2d6; }
  label { display: grid; gap: 6px; }
  label b { color: #d9b56b; font-weight: 600; }
  input { font: inherit; color: inherit; background: #0a1628; border: 1px solid rgba(217,181,107,.45); border-radius: 10px; padding: 12px 14px; }
  small { color: #8d98ae; }
</style>
</head>
<body>
<main>
  <h1>Teste de teclado</h1>
  <p>Escreva <b>Equilíbrio químico</b> nos cinco campos, com o mesmo teclado de sempre, e anote em qual deles o texto se apaga.</p>
  <label><b>Campo 1 · HTML puro</b><input id="c1" autocomplete="off"><small>Sem React.</small></label>
  <div id="app"></div>
  <label><b>Campo 4 · sem sugestões</b><input id="c4" autocomplete="off" autocorrect="off" spellcheck="false"><small>Pede ao teclado para não sugerir nem corrigir palavras.</small></label>
  <label><b>Campo 5 · sem sugestões nem maiúscula automática</b><input id="c5" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><small>Igual ao 4, e sem a maiúscula automática no início.</small></label>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  const h = React.createElement;
  function Controlado() {
    const [v, setV] = React.useState("");
    return h("label", null, h("b", null, "Campo 2 · como era no site"), h("input", { id: "c2", autoComplete: "off", value: v, onChange: (e) => setV(e.target.value) }), h("small", null, "React controla o valor a cada tecla."));
  }
  function Livre() {
    const [, setV] = React.useState("");
    return h("label", null, h("b", null, "Campo 3 · correção nova"), h("input", { id: "c3", autoComplete: "off", defaultValue: "", onChange: (e) => setV(e.target.value) }), h("small", null, "React só lê o valor; não regrava o campo."));
  }
  ReactDOM.createRoot(document.getElementById("app")).render(h(React.Fragment, null, h(Controlado), h(Livre)));
</script>
</body>
</html>
